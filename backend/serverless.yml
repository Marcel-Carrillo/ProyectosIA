service: ecommerce-backend

provider:
  name: aws
  runtime: nodejs20.x
  region: eu-north-1
  environment:
    NODE_ENV: production
    DATABASE_URL: ${ssm:/ecommerce/prod/DATABASE_URL}
    FRONTEND_URL: ${ssm:/ecommerce/prod/FRONTEND_URL}
    API_PUBLIC_URL: ${ssm:/ecommerce/prod/API_PUBLIC_URL}
    ADMIN_JWT_SECRET: ${ssm:/ecommerce/prod/ADMIN_JWT_SECRET}
    ADMIN_JWT_EXPIRES_IN: ${ssm:/ecommerce/prod/ADMIN_JWT_EXPIRES_IN}
    CUSTOMER_JWT_SECRET: ${ssm:/ecommerce/prod/CUSTOMER_JWT_SECRET}
    CUSTOMER_JWT_EXPIRES_IN: ${ssm:/ecommerce/prod/CUSTOMER_JWT_EXPIRES_IN}
    COOKIE_SECRET: ${ssm:/ecommerce/prod/COOKIE_SECRET}
    SMTP_HOST: ${ssm:/ecommerce/prod/SMTP_HOST}
    SMTP_PORT: ${ssm:/ecommerce/prod/SMTP_PORT}
    SMTP_SECURE: ${ssm:/ecommerce/prod/SMTP_SECURE}
    SMTP_USER: ${ssm:/ecommerce/prod/SMTP_USER}
    SMTP_PASS: ${ssm:/ecommerce/prod/SMTP_PASS}
    SMTP_FROM: ${ssm:/ecommerce/prod/SMTP_FROM}
    SMTP_STRICT: 'true'
    STRIPE_SECRET_KEY: ${ssm:/ecommerce/prod/STRIPE_SECRET_KEY}
    STRIPE_PUBLISHABLE_KEY: ${ssm:/ecommerce/prod/STRIPE_PUBLISHABLE_KEY}
    STRIPE_WEBHOOK_SECRET: ${ssm:/ecommerce/prod/STRIPE_WEBHOOK_SECRET}
    WELCOME_COUPON_PERCENT: '15'
    WELCOME_COUPON_MIN_ORDER: '0'
    GOOGLE_CLIENT_ID: ${ssm:/ecommerce/prod/GOOGLE_CLIENT_ID, ''}
    GOOGLE_CLIENT_SECRET: ${ssm:/ecommerce/prod/GOOGLE_CLIENT_SECRET, ''}
    CJDROPSHIPPING_API_KEY: ${ssm:/ecommerce/prod/CJDROPSHIPPING_API_KEY, ''}
    CJ_API_BASE_URL: https://developers.cjdropshipping.com/api2.0/v1
    CJ_SANDBOX_ORDERS: 'true'
    # Applied to supplierCost only (markup 1.6 = 60% margin on cost), then
    # CJ_DEFAULT_SHIPPING_ESTIMATE is added. Rounded to a ",99" ending.
    # Never publish at raw cost. Formula: cost * markup + shipping.
    CJ_DEFAULT_MARKUP_MULTIPLIER: '1.6'
    # Flat per-item shipping estimate ADDED after markup on cost — not a live
    # CJ freight quote (rate-limited to ~1 req/s; a per-item call inside
    # promote() would risk timing out the app Lambda for multi-item
    # batches). See cjCatalogPromotionService.ts's getDefaultShippingEstimate.
    CJ_DEFAULT_SHIPPING_ESTIMATE: '8'
    CJ_DEFAULT_CATEGORY_ID: ${ssm:/ecommerce/prod/CJ_DEFAULT_CATEGORY_ID, ''}
    SUPPLIER_AUTO_PROVISION_ENABLED: ${ssm:/ecommerce/prod/SUPPLIER_AUTO_PROVISION_ENABLED, 'false'}
    # Kill-switch for the customer-order-paid -> supplier-order -> CJ-push
    # automatic chain (fulfillment-automation). Gates both the payment
    # webhook's automation call (inside the `app` Lambda) and the
    # cjOrderStatusSync scheduled job below. Defaults off; sandbox-only CJ
    # pushes remain forced regardless (CJ_SANDBOX_ORDERS).
    FULFILLMENT_AUTOMATION_ENABLED: ${ssm:/ecommerce/prod/FULFILLMENT_AUTOMATION_ENABLED, 'false'}
    # Bounds supplierAutoProvision's per-run catalog sync window (design.md D2
    # in openspec/changes/cj-catalog-cursor-and-media). Cost is
    # calls = pages * (1 + pageSize) — one fetchCatalog call per page PLUS one
    # fetchVariants call per product — so both page count AND page size drive
    # runtime. At ~1.46s/product observed in production, 3 pages x 100/page
    # (300 products/run) completes in ~442s, comfortably under the 900s Lambda
    # timeout. syncCatalog now advances via a persisted per-connection cursor
    # (SupplierIntegration.catalogSyncCursorPage) rather than always restarting
    # at page 1, wrapping back to page 1 once the catalog end is reached.
    CJ_SYNC_MAX_PAGES: ${ssm:/ecommerce/prod/CJ_SYNC_MAX_PAGES, '3'}
    CJ_CATALOG_PAGE_SIZE: ${ssm:/ecommerce/prod/CJ_CATALOG_PAGE_SIZE, '100'}

functions:
  app:
    handler: src/lambda.handler
    events:
      - http:
          path: /
          method: any
          cors:
            origins:
              - 'https://d1p5rkpgizqh62.cloudfront.net'
              - 'https://mavile.es'
              - 'https://www.mavile.es'
            headers:
              - Content-Type
              - Authorization
              - Cookie
              - X-Requested-With
            allowCredentials: true
      - http:
          path: /{proxy+}
          method: any
          cors:
            origins:
              - 'https://d1p5rkpgizqh62.cloudfront.net'
              - 'https://mavile.es'
              - 'https://www.mavile.es'
            headers:
              - Content-Type
              - Authorization
              - Cookie
              - X-Requested-With
            allowCredentials: true

  # Scheduled, IAM-only job (no HTTP surface — design.md D9). Automates the
  # existing manual CJ Dropshipping onboarding flow (connect → verify → sync →
  # promote) end to end. Auto-promoted products are always created Draft; an
  # admin still manually adjusts price and activates them.
  supplierAutoProvision:
    handler: src/jobs/supplierAutoProvisionHandler.handler
    timeout: 900
    events:
      - schedule: rate(1 day)

  # Scheduled, IAM-only job (no HTTP surface, mirrors supplierAutoProvision
  # above). Pulls CJ Dropshipping order status for supplier orders that have
  # been pushed but not yet reached a terminal externalOrderStatus, and
  # propagates changes into Shipment records — see fulfillment-automation
  # spec. More frequent than the daily catalog sync since shipping status
  # changes matter to customers in near-real-time. No-ops entirely when
  # FULFILLMENT_AUTOMATION_ENABLED is not 'true'.
  cjOrderStatusSync:
    handler: src/jobs/cjOrderStatusSyncHandler.handler
    timeout: 900
    events:
      - schedule: rate(1 hour)

package:
  patterns:
    - '!node_modules/**'
    - 'node_modules/.prisma/client/**'
    - 'node_modules/@prisma/client/**'
    - '!node_modules/.prisma/client/libquery_engine-debian*'
    - '!node_modules/.prisma/client/libquery_engine-linux-musl*'
    - 'src/api-spec.yml'

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: false
    external:
      - '@prisma/client'
      - '.prisma'

# resources:
#   Resources:
#     # CloudWatch alarm — manual one-time setup (not deployed by serverless deploy):
#     #   Alarm name:   ecommerce-api-5xx-high
#     #   Namespace:    AWS/ApiGateway
#     #   Metric:       5XXError
#     #   Threshold:    >= 5 errors
#     #   Period:       300 seconds (5 min)
#     #   Evaluation:   1 period
#     # Create via AWS Console → CloudWatch → Alarms, or via AWS CLI:
#     #   aws cloudwatch put-metric-alarm --alarm-name ecommerce-api-5xx-high \
#     #     --metric-name 5XXError --namespace AWS/ApiGateway \
#     #     --statistic Sum --period 300 --evaluation-periods 1 --threshold 5 \
#     #     --comparison-operator GreaterThanOrEqualToThreshold
