name: Sync develop after release

# Prefer "Rebase and merge" on develop → master release PRs so both branches share the same tip.
# This workflow is a safety net when a merge commit was used on release: fast-forward develop to master.
# Requires repository secret SYNC_DEVELOP_PAT (admin PAT with bypass on protected develop).

on:
  push:
    branches:
      - master

jobs:
  sync-develop:
    name: Fast-forward develop to master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: develop
          token: ${{ secrets.SYNC_DEVELOP_PAT }}

      - name: Fast-forward develop when it is behind master
        env:
          GH_TOKEN: ${{ secrets.SYNC_DEVELOP_PAT }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin master develop

          DEVELOP_SHA="$(git rev-parse origin/develop)"
          MASTER_SHA="$(git rev-parse origin/master)"

          if [ "$DEVELOP_SHA" = "$MASTER_SHA" ]; then
            echo "develop and master already point to the same commit."
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/develop origin/master; then
            echo "develop is not an ancestor of master; skipping (hotfix on master?)."
            exit 0
          fi

          git checkout develop
          git merge origin/master --ff-only
          git push origin develop
          echo "develop fast-forwarded to master ($(git rev-parse --short HEAD))."
