name: Sync develop after release

# After merging develop → master, master gains a merge commit that develop lacks.
# GitHub then shows a false diff even though the tree is identical.
# Open a sync PR and merge with admin bypass (develop is protected: checks + review).

on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-develop:
    name: Align develop with master
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Sync develop via PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin master develop

          DEVELOP_SHA="$(git rev-parse origin/develop)"
          MASTER_SHA="$(git rev-parse origin/master)"

          if [ "$DEVELOP_SHA" = "$MASTER_SHA" ]; then
            echo "develop and master already point to the same commit ($MASTER_SHA)."
            exit 0
          fi

          if ! git merge-base --is-ancestor origin/develop origin/master; then
            echo "develop is not an ancestor of master; skipping auto-sync."
            echo "Merge master into develop manually if a hotfix landed on master only."
            exit 0
          fi

          SYNC_BRANCH="chore/sync-develop-${GITHUB_RUN_ID}"
          git checkout -B "$SYNC_BRANCH" origin/master
          git push origin "$SYNC_BRANCH"

          PR_URL="$(gh pr create \
            --base develop \
            --head "$SYNC_BRANCH" \
            --title "chore: sync develop with master after release" \
            --body "Automated after release merge. No code changes — aligns branch tips so GitHub compare stays empty.")"

          gh pr merge "$PR_URL" --merge --admin --delete-branch
          echo "develop synced via $PR_URL"
